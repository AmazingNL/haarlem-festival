services:
    nginx:
        image: nginx:latest
        ports:
            - "80:80"
            - "8081:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./:/app
        depends_on:
            php:
                condition: service_started

    composer:
        image: composer:2
        volumes:
            - ./:/app
        working_dir: /app
        command: install --no-interaction --no-progress --ignore-platform-reqs

    php:
        build:
            context: .
            dockerfile: PHP.Dockerfile
        env_file:
            - path: .env
              required: false
        volumes:
            - ./:/app
            - ./docker/php-app.ini:/usr/local/etc/php/conf.d/99-haarlem.ini
            - ./logs/php:/var/log/php
        working_dir: /app
        depends_on:
            composer:
                condition: service_completed_successfully

    mysql:
        image: mariadb:latest
        environment:
            MARIADB_ROOT_PASSWORD: "secret123"
            MARIADB_USER: "developer"
            MARIADB_PASSWORD: "secret123"
            MARIADB_DATABASE: "haarlem_festival"
        volumes:
            - mysqldata:/var/lib/mysql
        ports:
            - "3306:3306"
        healthcheck:
            test:
                [
                    "CMD",
                    "mariadb-admin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-psecret123",
                ]
            interval: 2s
            timeout: 2s
            retries: 30

    phpmyadmin:
        image: phpmyadmin:latest
        ports:
            - "8080:80"
        environment:
            - PMA_HOST=mysql
        depends_on:
            - mysql

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "1026:1025"
            - "8026:8025"
volumes:
    mysqldata: {}
